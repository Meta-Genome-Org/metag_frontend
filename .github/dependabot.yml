version: 2
updates:
  # Base images. Digest-only PRs auto-merge after CI (see the automerge
  # job in build.yml); tag changes need review.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    labels: [dependencies, docker]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, github-actions]

  # npm packages: version PRs are for review; security fixes also arrive as PRs.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, npm]
    # One PR per run for minor/patch updates and one for security fixes, so
    # they don't conflict over package-lock.json. Majors still come singly.
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        update-types: [minor, patch]
